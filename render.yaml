# Render.com blueprint — all-in-one deployment (site + /api/feed + 24/7 race loop).
# In Render: New + -> Blueprint -> connect this repo. It reads this file,
# prompts for the three secret keys, and deploys.
#
# NOTE: the loop needs an always-on instance. Render's FREE tier spins down
# after 15 min of no traffic, which pauses the race — use "starter" (~$7/mo).

services:
  - type: web
    name: the-race
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    disk:
      name: race-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # prompted in the dashboard, never stored in git
      - key: OPENAI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: FEATURED_PROBLEM
        value: Riemann
      - key: FEATURED_WEIGHT
        value: "0.7"
      - key: RACE_INTERVAL_MS
        value: "3600000"
      - key: DATA_DIR
        value: /data
